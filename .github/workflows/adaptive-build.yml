name: Cloudflare Measured Apple Silicon test package

on:
  workflow_dispatch:
  push:
    branches: [adaptive/macos-build]

permissions:
  contents: read

concurrency:
  group: adaptive-build-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_GIT_FETCH_WITH_CLI: true
  HUSKY: 0
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  build:
    if: github.repository == 'PeterHgg/clash-verge-rev'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.21.0'
      - uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.8'
          cache: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.99.0'
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: adaptive-${{ matrix.target }}
          cache-on-failure: true
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Check frontend
        run: |
          pnpm typecheck
          pnpm test
          pnpm arch:check
      - name: Prepare original packaging resources
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm run prebuild "${{ matrix.target }}"
      - name: Build and bundle both custom core entries
        env:
          # Unix socket fixtures must fit macOS's short sockaddr_un pathname limit.
          TMPDIR: /tmp
        run: node scripts/mihomo-local-build.mjs --target "${{ matrix.target }}" --output "$RUNNER_TEMP/adaptive-core" --bundle
      - name: Build ad-hoc signed application
        # Do not use pnpm build: its prebuild lifecycle could replace the custom cores.
        run: |
          node --input-type=module -e 'import {writeFileSync} from "node:fs"; writeFileSync("adaptive-test.conf.json", JSON.stringify({bundle:{createUpdaterArtifacts:false,macOS:{signingIdentity:"-"}}}))'
          pnpm exec tauri build --target "${{ matrix.target }}" --bundles app --config "$GITHUB_WORKSPACE/adaptive-test.conf.json"
      - name: Finalize identical signed core entries
        run: node scripts/adaptive-macos-finalize.mjs "$RUNNER_TEMP/adaptive-core" "target/${{ matrix.target }}/release/bundle/macos/Clash Verge.app"
      - name: Verify application and archive
        env:
          ADAPTIVE_TARGET: ${{ matrix.target }}
        run: node scripts/adaptive-artifacts.mjs "$RUNNER_TEMP/adaptive-core" "$RUNNER_TEMP/adaptive-app-artifacts" --app
      - name: Upload verified application archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CloudflareMeasured-2.5.9-arm64-app
          path: ${{ runner.temp }}/adaptive-app-artifacts/*
          if-no-files-found: error
          retention-days: 30
      - name: Create DMG without Finder automation
        run: |
          set -euxo pipefail
          staging="$(mktemp -d "$RUNNER_TEMP/adaptive-dmg-stage.XXXXXX")"
          ditto "target/${{ matrix.target }}/release/bundle/macos/Clash Verge.app" "$staging/Clash Verge.app"
          ln -s /Applications "$staging/Applications"
          mkdir -p "target/${{ matrix.target }}/release/bundle/dmg"
          hdiutil create -volname "Clash Verge" -srcfolder "$staging" -format UDZO "target/${{ matrix.target }}/release/bundle/dmg/Clash.Verge_2.5.9_arm64_CloudflareMeasured.dmg"
      - name: Verify final DMG and collect artifacts
        env:
          ADAPTIVE_TARGET: ${{ matrix.target }}
        run: node scripts/adaptive-artifacts.mjs "$RUNNER_TEMP/adaptive-core" "$RUNNER_TEMP/adaptive-dmg-artifacts"
      - name: Upload verified DMG
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CloudflareMeasured-2.5.9-arm64-dmg
          path: ${{ runner.temp }}/adaptive-dmg-artifacts/*
          if-no-files-found: error
          retention-days: 30
